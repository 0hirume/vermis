[package]
name = "vermis"
version = "0.9.0"
edition = "2024"
description = "A lossless Luau parser for formatting, linting, and source analysis"
repository = "https://github.com/0hirume/vermis"
license = "MIT"
keywords = ["luau", "parser", "syntax"]
categories = ["development-tools", "parsing"]
include = [
  "/README.md",
  "/src",
  "/tests",
  "/vendor/luau/LICENSE.txt",
  "/vendor/luau/lua_LICENSE.txt",
  "/vendor/luau/tests/conformance/*.lua",
  "/vendor/luau/tests/conformance/*.luau",
]

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
clone_on_ref_ptr = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
definition_in_module_root = "deny"
derive_partial_eq_without_eq = "deny"
fallible_impl_from = "deny"
inline_modules = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
self_named_module_files = "deny"
single_char_lifetime_names = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
use_self = "deny"
verbose_file_reads = "deny"

too_many_lines = "allow"

[lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }

missing_docs = "deny"
unreachable_pub = "deny"
